name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: C++ Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B engine/build -S engine
      - name: Build
        run: cmake --build engine/build
      - name: Test
        run: ctest --test-dir engine/build --output-on-failure

  backend:
    name: Python Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest backend/tests -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
